# ==============================================================================
# Nginx reverse proxy config untuk Platform Praktikum Linux.
#
# CARA PAKAI:
#   sudo cp config/nginx/linux-praktikum.conf /etc/nginx/sites-available/linux-praktikum
#   sudo ln -s /etc/nginx/sites-available/linux-praktikum /etc/nginx/sites-enabled/
#   sudo nginx -t          # validasi syntax sebelum reload
#   sudo systemctl reload nginx
#
# JANGAN LUPA setelah nginx aktif di depan app:
#   1. Set TRUST_PROXY_HOPS=1 di .env (persis 1 karena cuma ada nginx ini di depan
#      app, bukan proxy berlapis) - lihat src/app.js untuk penjelasan settingnya.
#   2. Set cookie session "secure: true" di src/app.js (baris yang ada komentar
#      "aktifkan kalau sudah pakai HTTPS") begitu TLS di bawah ini aktif.
#   3. Restart app: docker compose restart app
#
# Karena service "app" pada docker-compose.yml pakai network_mode: host, app
# langsung listen di port host (default 3000, lihat APP_PORT di .env) - makanya
# nginx di sini proxy ke 127.0.0.1:3000, BUKAN ke nama service Docker Compose.
# ==============================================================================

# Ganti nilai ini sesuai domain/IP server kampus kamu.
map $host $backend_upstream {
    default 127.0.0.1:3000;
}

# --- Redirect HTTP ke HTTPS (aktifkan setelah sertifikat TLS terpasang) ---
server {
    listen 80;
    listen [::]:80;
    server_name praktikum.contoh-kampus.ac.id;  # GANTI dengan domain/IP kamu

    # Endpoint khusus certbot (Let's Encrypt) buat renewal otomatis, biarkan
    # tetap lewat HTTP walau server_name di atas dialihkan ke HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name praktikum.contoh-kampus.ac.id;  # GANTI dengan domain/IP kamu

    # --- Sertifikat TLS ---
    # Cara paling gampang: certbot (Let's Encrypt), gratis dan auto-renewal.
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d praktikum.contoh-kampus.ac.id
    # certbot otomatis ngisi 2 baris di bawah ini, tapi kalau mau setup manual:
    ssl_certificate     /etc/letsencrypt/live/praktikum.contoh-kampus.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/praktikum.contoh-kampus.ac.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS - browser bakal selalu paksa HTTPS buat domain ini setelah kunjungan pertama.
    # Aktifkan SETELAH yakin TLS-nya stabil (salah konfigurasi HSTS agak nyusahin di-rollback).
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Batas ukuran body request - platform ini ga ada upload file lewat HTTP
    # (import CSV mahasiswa dilakukan lewat docker compose exec, bukan form upload),
    # jadi 1m sudah lebih dari cukup dan sekalian jadi proteksi tambahan.
    client_max_body_size 1m;

    access_log /var/log/nginx/linux-praktikum.access.log;
    error_log  /var/log/nginx/linux-praktikum.error.log;

    location / {
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dinaikkan dikit dari default nginx - provisioning container via
        # Docker API (POST /api/containers) kadang butuh beberapa detik lebih
        # dari request HTTP biasa.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
